name: CI RSpec Test

on: [push, pull_request]

jobs:
  test:
    name: test (ruby=${{ matrix.ruby }}, mongoid=${{ matrix.mongoid }}, mongodb=${{ matrix.mongodb }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.3', mongoid: '3', mongodb: '4.4' }
          - { ruby: '2.4', mongoid: '4', mongodb: '4.4' }
          - { ruby: '2.5', mongoid: '5', mongodb: '4.4' }
          - { ruby: '2.6', mongoid: '6', mongodb: '4.4' }
          - { ruby: '2.5', mongoid: '7', mongodb: '4.4' }
          - { ruby: '2.6', mongoid: '7', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '7.0', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '7.1', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '7.2', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '7.3', mongodb: '4.4' }
          - { ruby: '3.0', mongoid: '7', mongodb: '4.4' }
          - { ruby: 'jruby-9.4', mongoid: '7', mongodb: '4.4' }
          - { ruby: '3.2', mongoid: '8', mongodb: '6.0' }
          - { ruby: '3.3', mongoid: '9', mongodb: '7.0' }
          - { ruby: '3.4', mongoid: '9', mongodb: '8.0' }
          - { ruby: '4.0', mongoid: '9', mongodb: '8.0', coverage: 'true' }
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})' || mongo --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGOID_VERSION: ${{ matrix.mongoid }}
      COVERAGE: ${{ matrix.coverage }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: psych-compatible
      - name: Run tests
        timeout-minutes: 10
        run: bundle exec rspec
      - name: Report coverage
        if: ${{ matrix.coverage == 'true' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/.resultset.json
          format: simplecov
